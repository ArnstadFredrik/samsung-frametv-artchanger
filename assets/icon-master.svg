<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#31353D"/>
      <stop offset="1" stop-color="#17191D"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35507A"/>
      <stop offset="0.55" stop-color="#7A6A9E"/>
      <stop offset="1" stop-color="#E8A87C"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded squircle (macOS Big Sur ratio 185.4/1024) -->
  <rect x="0" y="0" width="1024" height="1024" rx="185.4" fill="url(#bg)"/>

  <!-- TV body: MDI television glyph (Apache 2.0, Pictogrammers) scaled to 24*32=768px -->
  <g transform="translate(128,128) scale(32)">
    <path d="M21,17H3V5H21M21,3H3A2,2 0 0,0 1,5V17A2,2 0 0,0 3,19H8V21H16V19H21A2,2 0 0,0 23,17V5A2,2 0 0,0 21,3Z" fill="#E8E4DC"/>
  </g>

  <!-- Screen area (glyph coords 3,5 - 21,17 => px 224,288 - 800,672) -->
  <rect x="224" y="288" width="576" height="384" fill="url(#screen)"/>

  <!-- Art inside the screen: MDI image-multiple glyph (Apache 2.0) -->
  <g transform="translate(332,300) scale(15)">
    <path d="M22,16V4A2,2 0 0,0 20,2H8A2,2 0 0,0 6,4V16A2,2 0 0,0 8,18H20A2,2 0 0,0 22,16M11,12L13.03,14.71L16,11L20,16H8M2,6V20A2,2 0 0,0 4,22H18V20H4V6" fill="#FFFFFF"/>
  </g>
</svg>
